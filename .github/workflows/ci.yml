name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight deps for validation
        run: |
          python -m pip install --upgrade pip
          pip install rocrate cffconvert

      - name: Compile all Python sources
        run: python -m compileall -q src/

      - name: Validate CITATION.cff
        run: cffconvert --validate

      - name: Validate codemeta.json
        run: python -c "import json; json.load(open('codemeta.json'))"

      - name: Validate RO-Crate
        run: python -c "from rocrate.rocrate import ROCrate; ROCrate('ro-crate')"