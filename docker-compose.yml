services:
  # ---------------------------------------------------------------
  # Grobid — extraccion estructurada de PDFs cientificos (paso 02)
  # ---------------------------------------------------------------
  grobid:
    image: lfoppiano/grobid:0.8.1
    container_name: kg-genai-grobid
    ports:
      - "8070:8070"
    init: true
    ulimits:
      core: 0
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Fuseki — triple store que sirve el KG (kg.ttl)
  # ---------------------------------------------------------------
  fuseki:
    image: stain/jena-fuseki:5.0.0
    container_name: kg-genai-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: admin
      FUSEKI_DATASET_1: kg
    volumes:
      - ./fuseki-data:/fuseki
      - ./data/kg.ttl:/staging/kg.ttl:ro
    restart: unless-stopped

  # ---------------------------------------------------------------
  # App Streamlit — demo de consultas sobre el KG
  # ---------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: kg-genai-app
    ports:
      - "8501:8501"
    environment:
      FUSEKI_ENDPOINT: http://fuseki:3030/kg/sparql
    depends_on:
      - fuseki
    volumes:
      - ./data:/app/data:ro
